<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oreo the Dog: Game of the Year</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <h1>Oreo the Dog: Game of the Year</h1>
        <div class="stats">
          <div class="stat"><span class="label">Bones:</span> <span id="bones-count">0</span></div>
          <div class="stat"><span class="label">Time:</span> <span id="time-elapsed">0.0s</span></div>
          <div class="stat"><span class="label">Mood:</span> <span id="mood-status">Chill</span></div>
        </div>
      </div>
      <div class="cta">
        <p>Use WASD or arrow keys to move Oreo. Space to bark. Collect all the biscuits before sunset!</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
